#
# RAMBO's FastCGI server and URL toolkit.
# Browser -> Hiawatha (:443) -> unix socket -> rambo serve.
#
# On the host this file is /etc/hiawatha/urltoolkit/60-rambo.conf.
# hiawatha.conf reads the whole directory before enable-sites, where the
# VirtualHost that uses the toolkit lives.  Every file in an included
# directory is read, a .bak included: a refused copy goes out of the
# directory, not next to it.
#
# ConnectTo must be <socket_dir>/rambo.sock of /etc/rambo/rambo.conf.

FastCGIserver {
    FastCGIid = Rambo
    ConnectTo = /var/run/rambo/rambo.sock
}

# The files of the website root are served as they are: the stylesheet,
# the icons and the scripts below /static/, the icon of the site and the
# worker of the puzzle.  Every other path goes to RAMBO.
UrlToolkit {
    ToolkitId = rambo
    Match ^/static/[A-Za-z0-9._-]+$ Exit
    Match ^/favicon\.ico$ Exit
    Match ^/pow-worker\.js$ Exit
    Match .* UseFastCGI Rambo
}
