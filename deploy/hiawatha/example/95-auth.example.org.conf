#
# RAMBO - auth.example.org, an example.  On a host the file is
# /etc/hiawatha/enable-sites/95-<host of the issuer>.conf, with that host in
# Hostname and TLScertFile; it lies apart from enable-sites/ here, since
# Hiawatha reads every file of an included directory.
# Toolkit and FastCGI: urltoolkit/60-rambo.conf
#
# Unlike the earlier Go provider, rambo does not carry its stylesheet, icons and scripts in
# the binary: Hiawatha serves them from /usr/local/share/rambo/www, the
# website root, and hands every other path to rambo.  The headers below are
# for those files; rambo sets its own on its pages, the same values.

VirtualHost {
    Hostname = auth.example.org
    WebsiteRoot = /usr/local/share/rambo/www
    UseToolkit = rambo
    RequireTLS = yes, 31536000; includeSubDomains
    TLScertFile = tls/auth.example.org.pem
    BanByCGI = yes, 3600
    # client_secret_basic at /token: Hiawatha passes the Authorization
    # header to FastCGI only with this.
    HTTPAuthToCGI = yes
    CustomHeaderClient = X-Content-Type-Options: nosniff
    CustomHeaderClient = Referrer-Policy: no-referrer
    CustomHeaderClient = X-Frame-Options: DENY
    AccessLogfile = /var/log/hiawatha/rambo_access.log, daily
    ErrorLogfile = /var/log/hiawatha/rambo_error.log
}
